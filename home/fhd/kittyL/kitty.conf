# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Adwaita darker
#include current-theme.conf
# END_KITTY_THEME

font_family JetBrainsMono Nerd Font Propo
font_size 17
disable_ligatures never
enable_audio_bell no
cursor_shape block
remember_window_size no 
window_padding_width 25 

# cursor animation #
cursor_trail 15
cursor_trail_start_threshold 0
cursor_trail_decay 0 0.5

cursor_stop_blinking_after 0
cursor_blink_interval 0
background_opacity 1
confirm_os_window_close 0
sync_to_monitor no
selection_background #ca9ee6
selection_foreground #000000


background #181825
foreground #eff1f5

color0 #11111b
color1 #e64553
color2 #40a02b
color3 #df8e1d
color4 #1e66f5
color5 #8839ef
color6 #179299
color7 #dce0e8


color8 #bcc0cc
color9 #ea999c
color10 #a6d189
color11 #e5c890
color12 #8caaee
color13 #ca9ee6
color14 #81c8be 
color15 #eff1f5
